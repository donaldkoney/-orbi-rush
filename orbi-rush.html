<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orbi Rush - Jeu de plateforme</title>
<meta name="description" content="Orbi Rush : roule, saute, écrase les ennemis et collecte les étoiles dans ce jeu de plateforme gratuit.">
<!-- AdSense : ajoute ici ta balise de vérification de site si Google la demande -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0e1424;overflow:hidden;touch-action:none;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
#page{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
#wrap{position:relative;width:min(100vw,calc((100vh - 70px) * 800 / 448));aspect-ratio:800/448;background:#000;
  border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #0008}
canvas{width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1226cc;
  backdrop-filter:blur(3px)}
.card{text-align:center;padding:18px 22px;max-width:92%}
.card h1{margin:0 0 6px;font-size:clamp(26px,6vw,46px);letter-spacing:1px;
  background:linear-gradient(90deg,#2ef2d0,#6fa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.txt{font-size:clamp(13px,2.6vw,17px);line-height:1.45;opacity:.92;margin-bottom:14px}
.bt{display:flex;flex-direction:column;gap:10px;align-items:center}
button{font:inherit;font-weight:700;font-size:clamp(15px,3vw,20px);color:#062;border:0;border-radius:999px;
  padding:12px 30px;background:linear-gradient(#5ff7dc,#1fd1b4);box-shadow:0 4px 0 #0a8f7b;cursor:pointer}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a8f7b}
#revive{background:linear-gradient(#ffe27a,#ffb627);box-shadow:0 4px 0 #b57a00;color:#4a3000}
#touch{position:absolute;inset:auto 0 0 0;display:none;justify-content:space-between;padding:10px 14px;pointer-events:none}
#touch .g{display:flex;gap:12px}
.tb{pointer-events:auto;width:clamp(54px,14vw,78px);height:clamp(54px,14vw,78px);border-radius:50%;
  background:#ffffff30;border:2px solid #ffffff60;display:flex;align-items:center;justify-content:center;
  font-size:clamp(22px,6vw,34px);touch-action:none}
.tb.on{background:#ffffff66}
#ad{min-height:50px;width:min(100vw,728px);margin-top:6px;text-align:center}
@media (pointer:coarse){#touch{display:flex}}
</style>
</head>
<body>
<div id="page">
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="touch">
      <div class="g"><div class="tb" id="bl">◀</div><div class="tb" id="br">▶</div></div>
      <div class="g"><div class="tb" id="bj">▲</div></div>
    </div>
    <div id="ov"></div>
  </div>
  <!-- Bannière AdSense (affichée seulement si BANNER_SLOT est renseigné plus bas) -->
  <div id="ad"></div>
</div>

<script>
(() => {
"use strict";

/* ============================================================
   CONFIG MONÉTISATION GOOGLE ADSENSE
   1) Renseigne ton ID éditeur : "ca-pub-XXXXXXXXXXXXXXXX"
   2) (Optionnel) BANNER_SLOT : ID d'un bloc d'annonces display
   3) ADS_TEST = true pendant les tests, false une fois en ligne
   Laissé vide, le jeu fonctionne sans pub.
   ============================================================ */
const ADS_CLIENT = "";      // ex : "ca-pub-1234567890123456"
const BANNER_SLOT = "";     // ex : "1234567890"
const ADS_TEST = true;

/* ---------- Pubs ---------- */
let muted = false;
function adConfig(o){ (window.adsbygoogle = window.adsbygoogle || []).push(o); }
function adBreak(o){ (window.adsbygoogle = window.adsbygoogle || []).push(o); }

if (ADS_CLIENT) {
  const s = document.createElement("script");
  s.async = true; s.crossOrigin = "anonymous";
  s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + ADS_CLIENT;
  if (ADS_TEST) s.setAttribute("data-adbreak-test", "on");
  document.head.appendChild(s);
  adConfig({ preloadAdBreaks: "on", sound: "on" });
  if (BANNER_SLOT) {
    const ins = document.createElement("ins");
    ins.className = "adsbygoogle"; ins.style.display = "block";
    ins.setAttribute("data-ad-client", ADS_CLIENT);
    ins.setAttribute("data-ad-slot", BANNER_SLOT);
    ins.setAttribute("data-ad-format", "auto");
    ins.setAttribute("data-full-width-responsive", "true");
    document.getElementById("ad").appendChild(ins);
    (window.adsbygoogle = window.adsbygoogle || []).push({});
  }
}

// Pub entre deux niveaux
function interstitial(done){
  if (!ADS_CLIENT) return done();
  let fin = false, started = false;
  const end = () => { if (!fin) { fin = true; muted = false; done(); } };
  adBreak({ type: "next", name: "next-level",
    beforeAd: () => { started = true; muted = true; },
    afterAd: () => { muted = false; },
    adBreakDone: end });
  setTimeout(() => { if (!started) end(); }, 2500); // bloqueur de pub / pas de pub dispo
}

// Pub "récompense" : continuer après un game over
let reviveShow = null;
function offerRevive(){
  reviveShow = null;
  if (!ADS_CLIENT) return;
  adBreak({ type: "reward", name: "revive",
    beforeAd: () => { muted = true; },
    afterAd: () => { muted = false; },
    beforeReward: (show) => {
      reviveShow = show;
      const b = document.getElementById("revive");
      if (b) b.style.display = "inline-block";
    },
    adViewed: () => doRevive(),
    adDismissed: () => {},
    adBreakDone: () => { muted = false; } });
}

/* ---------- Utilitaires ---------- */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0;
  let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function load(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

/* ---------- Son ---------- */
let ac = null;
function initAudio(){
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === "suspended") ac.resume();
  } catch(e){}
}
function snd(f, d = .1, type = "square", v = .05, slide = 0){
  if (muted || !ac) return;
  try {
    const o = ac.createOscillator(), g = ac.createGain(), n = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, n);
    if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), n + d);
    g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.001, n + d);
    o.connect(g); g.connect(ac.destination); o.start(); o.stop(n + d);
  } catch(e){}
}

/* ---------- Canvas ---------- */
const VW = 800, VH = 448, T = 32, ROWS = 14;
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = VW * dpr; cv.height = VH * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
const ov = document.getElementById("ov");

/* ---------- Génération de niveaux ---------- */
function genLevel(n){
  const rnd = mulberry32(n * 7919 + 13);
  const R = (a, b) => a + Math.floor(rnd() * (b - a + 1));
  const diff = Math.min(n, 8);
  const len = 140 + diff * 20;
  const top = [], spikes = [], stars = [], enemies = [], platList = [], plat = new Set();
  let h = 11, x = 0;
  const flat = k => { const s = x; for (let i = 0; i < k; i++) top[x++] = h; return s; };

  flat(8);
  while (x < len) {
    const r = rnd();
    if (r < 0.28) {                       // trou
      const g = R(2, Math.min(4, 2 + (diff >> 1)));
      for (let i = 0; i < g; i++) {
        const k = (i + 0.5) / g;
        stars.push({ x: x + i, y: Math.round(h - 2 - Math.sin(k * Math.PI) * 2.5) });
      }
      for (let i = 0; i < g; i++) top[x++] = -1;
      h = clamp(h + R(-1, 1), 8, 12);
      flat(R(4, 6));
    } else if (r < 0.45) {                // marche
      h = clamp(h + [-2, -1, 1, 2][R(0, 3)], 8, 12);
      const s = flat(R(4, 7));
      stars.push({ x: s + 1, y: h - 2 });
    } else if (r < 0.65) {                // pointes
      const s = flat(10);
      const w = (diff >= 3 && rnd() < 0.4) ? 3 : R(1, 2);
      for (let i = 0; i < w; i++) spikes.push({ x: s + 4 + i, y: h - 1 });
      for (let i = 0; i < w + 2; i++) stars.push({ x: s + 3 + i, y: h - 3 - ((i > 0 && i <= w) ? 1 : 0) });
    } else if (r < 0.85) {                // ennemi
      const k = R(7, 10), s = flat(k), w = 28;
      const min = (s + 1) * T, max = (s + k - 1) * T - w;
      enemies.push({ x: (min + max) / 2, min, max, w, h: 26, y: h * T - 26, dir: rnd() < .5 ? -1 : 1 });
      stars.push({ x: s + (k >> 1), y: h - 3 });
    } else {                              // plateforme flottante
      const s = flat(8);
      for (let i = 0; i < 3; i++) {
        plat.add((s + 2 + i) + "," + (h - 3)); platList.push({ x: s + 2 + i, y: h - 3 });
        stars.push({ x: s + 2 + i, y: h - 4 });
      }
    }
  }
  const fs = flat(12);
  return { W: x, top, spikes, stars: stars.map(s => ({ ...s, got: false })), enemies, plat, platList,
           flagX: fs + 8, hue: (200 + n * 37) % 360 };
}

/* ---------- État du jeu ---------- */
let level = 1, score = 0, lives = 3, lvScore0 = 0;
let best = load("orbi_best", 0);
let state = "menu";                 // menu | play | dead | won | over | wait
let L, p, enemies, camX = 0, deadTimer = 0, tick = 0, particles = [];
const keys = { l: false, r: false, j: false, jumpPressed: false };

function startLevel(n){
  level = n; L = genLevel(n);
  p = { x: 2 * T, y: L.top[2] * T - 26, w: 26, h: 26, vx: 0, vy: 0, onGround: false,
        coyote: 0, buf: 0, rot: 0, face: 1 };
  enemies = L.enemies.map(e => ({ ...e, alive: true }));
  camX = 0; particles = []; state = "play";
}

/* ---------- Collisions ---------- */
function solid(tx, ty){
  if (tx < 0 || tx >= L.W) return true;
  const t = L.top[tx];
  if (t !== -1 && ty >= t) return true;
  return L.plat.has(tx + "," + ty);
}
function collideX(){
  const y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h - .01) / T);
  const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - .01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (solid(tx, ty)) {
      if (p.vx > 0) p.x = tx * T - p.w; else if (p.vx < 0) p.x = (tx + 1) * T;
      p.vx = 0; return;
    }
  }
}
function collideY(){
  const y0 = Math.floor(p.y / T), y1 = Math.floor((p.y + p.h - .01) / T);
  const x0 = Math.floor(p.x / T), x1 = Math.floor((p.x + p.w - .01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (solid(tx, ty)) {
      if (p.vy > 0) { p.y = ty * T - p.h; p.onGround = true; }
      else if (p.vy < 0) p.y = (ty + 1) * T;
      p.vy = 0; return;
    }
  }
}

/* ---------- Particules ---------- */
function burst(x, y, color, n = 10){
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = 1 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 30 + Math.random() * 20, c: color });
  }
}

/* ---------- Mise à jour ---------- */
function die(){
  if (state !== "play") return;
  state = "dead"; deadTimer = 70; p.vy = -9; p.vx = 0;
  burst(p.x + 13, p.y + 13, "#2ef2d0", 16);
  snd(300, .5, "sawtooth", .06, -250);
}
function afterDeath(){
  lives--;
  if (lives <= 0) return gameOver();
  score = lvScore0; startLevel(level);
}
function playerUpdate(){
  const dir = (keys.r ? 1 : 0) - (keys.l ? 1 : 0);
  p.vx += (dir * 4.3 - p.vx) * (p.onGround ? 0.22 : 0.12);
  if (!dir && Math.abs(p.vx) < 0.1) p.vx = 0;
  if (dir) p.face = dir;
  p.coyote = p.onGround ? 6 : p.coyote - 1;
  if (keys.jumpPressed) { p.buf = 7; keys.jumpPressed = false; }
  p.buf--;
  if (p.buf > 0 && p.coyote > 0) { p.vy = -12.2; p.coyote = 0; p.buf = 0; snd(420, .15, "square", .05, 300); }
  p.vy += (p.vy < 0 && !keys.j) ? 1.3 : 0.62;
  if (p.vy > 14) p.vy = 14;
  p.x += p.vx; collideX();
  p.y += p.vy; p.onGround = false; collideY();
  p.rot += p.vx / 14;
  if (p.y > VH + 60) die();
}
function update(){
  tick++;
  if (state === "play") {
    playerUpdate();
    const spd = 0.9 + Math.min(level, 8) * 0.06;
    for (const e of enemies) {
      if (!e.alive) continue;
      e.x += e.dir * spd;
      if (e.x < e.min) { e.x = e.min; e.dir = 1; }
      if (e.x > e.max) { e.x = e.max; e.dir = -1; }
      if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) {
        if (p.vy > 0 && p.y + p.h - e.y < 18) {
          e.alive = false; p.vy = keys.j ? -11 : -8; score += 50;
          burst(e.x + 14, e.y + 14, "#b56bff", 12); snd(220, .15, "square", .06, 300);
        } else die();
      }
    }
    for (const s of L.spikes) {
      const sx = s.x * T + 5, sy = s.y * T + 12;
      if (p.x < sx + 22 && p.x + p.w > sx && p.y < sy + 20 && p.y + p.h > sy) die();
    }
    for (const s of L.stars) {
      if (s.got) continue;
      const cx = s.x * T + 16, cy = s.y * T + 16;
      if (Math.abs(p.x + 13 - cx) < 22 && Math.abs(p.y + 13 - cy) < 22) {
        s.got = true; score += 10; burst(cx, cy, "#ffe14d", 8); snd(880, .12, "triangle", .06, 400);
      }
    }
    if (p.x + p.w > L.flagX * T + 8) win();
    camX = clamp(p.x - VW * 0.35, 0, L.W * T - VW);
  } else if (state === "dead") {
    p.vy += 0.5; p.y += p.vy;
    if (--deadTimer <= 0) afterDeath();
  }
  for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vy += 0.15; q.life--; }
  particles = particles.filter(q => q.life > 0);
}

/* ---------- Écrans ---------- */
function showOv(title, html, btns){
  ov.innerHTML = `<div class="card"><h1>${title}</h1><div class="txt">${html}</div><div class="bt"></div></div>`;
  const bt = ov.querySelector(".bt");
  btns.forEach(b => {
    const e = document.createElement("button");
    e.textContent = b[0]; if (b[2]) e.id = b[2]; if (b[3]) e.style.display = "none";
    e.onclick = () => { initAudio(); b[1](); };
    bt.appendChild(e);
  });
  ov.style.display = "flex";
}
function hideOv(){ ov.style.display = "none"; }
function newGame(){ level = 1; score = 0; lives = 3; lvScore0 = 0; hideOv(); startLevel(1); }

function win(){
  if (state !== "play") return;
  state = "won";
  const got = L.stars.filter(s => s.got).length;
  score += 200; if (score > best) { best = score; save("orbi_best", best); }
  snd(660, .4, "triangle", .07, 500);
  showOv("Niveau " + level + " terminé !",
    `★ ${got} / ${L.stars.length} étoiles<br>Score : <b>${score}</b> &nbsp;•&nbsp; Record : ${best}`,
    [["Niveau suivant ▶", () => {
      hideOv(); state = "wait";
      interstitial(() => { lvScore0 = score; startLevel(level + 1); });
    }]]);
}
function gameOver(){
  state = "wait";
  if (score > best) { best = score; save("orbi_best", best); }
  interstitial(() => {
    state = "over";
    showOv("Game Over", `Niveau ${level} &nbsp;•&nbsp; Score : <b>${score}</b><br>Record : ${best}`,
      [["Revoir une pub pour continuer", () => { if (reviveShow) reviveShow(); }, "revive", true],
       ["↻ Rejouer", newGame]]);
    offerRevive();
  });
}
function doRevive(){ lives = 2; score = lvScore0; hideOv(); startLevel(level); }

function showMenu(){
  state = "menu";
  showOv("ORBI RUSH",
    `Aide Orbi à traverser les niveaux !<br>Saute, écrase les ennemis, évite les pointes<br>et atteins le drapeau.<br>
     <small>⌨ ← → bouger &nbsp;•&nbsp; Espace / ↑ sauter &nbsp;•&nbsp; Record : ${best}</small>`,
    [["▶ Jouer", newGame]]);
}

/* ---------- Dessin ---------- */
function starPath(cx, cy, r){
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function draw(){
  const hue = L.hue;
  let g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, `hsl(${hue},75%,60%)`); g.addColorStop(1, `hsl(${(hue + 40) % 360},85%,86%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  for (let layer = 0; layer < 2; layer++) {
    ctx.fillStyle = `hsl(${(hue + 20) % 360},38%,${58 - layer * 12}%)`;
    ctx.beginPath(); ctx.moveTo(0, VH);
    for (let sx = 0; sx <= VW; sx += 10) {
      const wx = sx + camX * (0.2 + layer * 0.25);
      ctx.lineTo(sx, VH - 120 - layer * 40 + Math.sin(wx * 0.008 + layer * 2) * 30 + Math.sin(wx * 0.021) * 12);
    }
    ctx.lineTo(VW, VH); ctx.fill();
  }
  ctx.fillStyle = "#ffffffcc";
  for (let i = 0; i < 6; i++) {
    const cx = (((i * 230 - camX * 0.15) % (VW + 200)) + VW + 200) % (VW + 200) - 100, cy = 40 + (i * 37) % 90;
    ctx.beginPath(); ctx.ellipse(cx, cy, 38, 14, 0, 0, 7); ctx.ellipse(cx + 24, cy - 8, 26, 14, 0, 0, 7);
    ctx.ellipse(cx - 22, cy - 5, 22, 11, 0, 0, 7); ctx.fill();
  }

  ctx.save(); ctx.translate(-Math.round(camX), 0);
  const x0 = Math.max(0, Math.floor(camX / T)), x1 = Math.min(L.W - 1, x0 + Math.ceil(VW / T) + 1);

  for (let x = x0; x <= x1; x++) {
    const t = L.top[x]; if (t === -1) continue;
    ctx.fillStyle = "hsl(25,45%,38%)"; ctx.fillRect(x * T, t * T, T, (ROWS - t) * T);
    ctx.fillStyle = "rgba(0,0,0,.08)";
    for (let r = t + 1; r < ROWS; r++) if ((x + r) & 1) ctx.fillRect(x * T, r * T, T, T);
    ctx.fillStyle = "hsl(110,58%,44%)"; ctx.fillRect(x * T, t * T, T, 9);
    ctx.fillStyle = "hsl(110,58%,34%)"; ctx.fillRect(x * T, t * T + 9, T, 3);
  }
  for (const q of L.platList) {
    if (q.x < x0 || q.x > x1) continue;
    ctx.fillStyle = "#b9822f"; ctx.fillRect(q.x * T, q.y * T, T, T);
    ctx.fillStyle = "#5fcf4a"; ctx.fillRect(q.x * T, q.y * T, T, 7);
    ctx.fillStyle = "#00000022"; ctx.fillRect(q.x * T, q.y * T + 26, T, 6);
  }
  for (const s of L.spikes) {
    if (s.x < x0 || s.x > x1) continue;
    ctx.fillStyle = "#d9e2ec"; ctx.beginPath();
    ctx.moveTo(s.x * T + 2, (s.y + 1) * T); ctx.lineTo(s.x * T + 16, s.y * T + 6); ctx.lineTo(s.x * T + 30, (s.y + 1) * T);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#7b8a9a"; ctx.lineWidth = 2; ctx.stroke();
  }
  for (const s of L.stars) {
    if (s.got || s.x < x0 || s.x > x1) continue;
    const cy = s.y * T + 16 + Math.sin(tick * 0.08 + s.x) * 3;
    ctx.fillStyle = "#ffd324"; starPath(s.x * T + 16, cy, 11); ctx.fill();
    ctx.strokeStyle = "#e29a00"; ctx.lineWidth = 2; ctx.stroke();
  }
  // drapeau
  { const fx = L.flagX * T + 14, fy = L.top[L.flagX] * T;
    ctx.fillStyle = "#e7edf3"; ctx.fillRect(fx, fy - 110, 4, 110);
    ctx.fillStyle = "#ffcf33"; ctx.beginPath();
    const w = Math.sin(tick * 0.1) * 3;
    ctx.moveTo(fx + 4, fy - 108); ctx.lineTo(fx + 44, fy - 92 + w); ctx.lineTo(fx + 4, fy - 76); ctx.fill();
    ctx.fillStyle = "#ffd324"; ctx.beginPath(); ctx.arc(fx + 2, fy - 112, 6, 0, 7); ctx.fill(); }

  // ennemis
  for (const e of enemies) {
    if (!e.alive || e.x + 40 < camX || e.x > camX + VW) continue;
    const cx = e.x + e.w / 2, by = e.y + e.h, wob = Math.sin(tick * 0.2 + e.x) * 1.5;
    ctx.fillStyle = "#8a4bd8";
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(cx + i * 9 - 5, by - 18); ctx.lineTo(cx + i * 9, by - 30 + wob); ctx.lineTo(cx + i * 9 + 5, by - 18); ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(cx, by - 11, 15, 12 + wob * .3, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx - 5, by - 13, 4.5, 0, 7); ctx.arc(cx + 5, by - 13, 4.5, 0, 7); ctx.fill();
    ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(cx - 5 + e.dir * 1.5, by - 12, 2, 0, 7); ctx.arc(cx + 5 + e.dir * 1.5, by - 12, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = "#2a1450"; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(cx - 10, by - 21); ctx.lineTo(cx - 2, by - 17); ctx.moveTo(cx + 10, by - 21); ctx.lineTo(cx + 2, by - 17); ctx.stroke();
  }

  // Orbi (le joueur)
  { const cx = p.x + 13, cy = p.y + 13, r = 14;
    ctx.fillStyle = "#0004"; ctx.beginPath(); ctx.ellipse(cx, p.y + 28, 11, 3, 0, 0, 7);
    if (p.onGround) ctx.fill();
    const gr = ctx.createRadialGradient(cx - 5, cy - 6, 2, cx, cy, r);
    gr.addColorStop(0, "#9ffff0"); gr.addColorStop(1, "#14b8a0");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = "#0a7d6c"; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.rot);   // motif qui roule
    ctx.strokeStyle = "#ffffff88"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 9, 0.3, 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 9, 3.4, 5.0); ctx.stroke();
    ctx.restore();
    const f = p.face * 3;                                  // visage fixe
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(cx - 4 + f, cy - 3, 4.2, 0, 7); ctx.arc(cx + 5 + f, cy - 3, 4.2, 0, 7); ctx.fill();
    ctx.fillStyle = "#12313a"; ctx.beginPath(); ctx.arc(cx - 3 + f * 1.3, cy - 2.5, 2, 0, 7); ctx.arc(cx + 6 + f * 1.3, cy - 2.5, 2, 0, 7); ctx.fill();
    ctx.strokeStyle = "#12313a"; ctx.lineWidth = 2; ctx.beginPath();
    if (state === "dead") ctx.arc(cx + f, cy + 8, 3, Math.PI, 0); else ctx.arc(cx + f, cy + 3, 5, 0.2, 2.9);
    ctx.stroke(); }

  for (const q of particles) { ctx.globalAlpha = Math.min(1, q.life / 20); ctx.fillStyle = q.c; ctx.fillRect(q.x - 2, q.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.restore();

  // HUD
  ctx.font = "bold 20px system-ui,sans-serif"; ctx.textBaseline = "top";
  ctx.lineWidth = 4; ctx.strokeStyle = "#0008"; ctx.fillStyle = "#fff";
  const txt = (s, x, y, al) => { ctx.textAlign = al; ctx.strokeText(s, x, y); ctx.fillText(s, x, y); };
  txt("♥".repeat(Math.max(0, lives)), 12, 10, "left");
  txt("★ " + L.stars.filter(s => s.got).length + "/" + L.stars.length, 12, 36, "left");
  txt("Niveau " + level, VW / 2, 10, "center");
  txt("Score " + score, VW - 12, 10, "right");
  const pr = clamp(p.x / (L.flagX * T), 0, 1);           // barre de progression
  ctx.fillStyle = "#0006"; ctx.fillRect(VW / 2 - 80, 38, 160, 8);
  ctx.fillStyle = "#ffd324"; ctx.fillRect(VW / 2 - 80, 38, 160 * pr, 8);
}

/* ---------- Entrées ---------- */
const KMAP = { ArrowLeft: "l", KeyA: "l", KeyQ: "l", ArrowRight: "r", KeyD: "r",
               ArrowUp: "j", KeyW: "j", KeyZ: "j", Space: "j" };
addEventListener("keydown", e => {
  const k = KMAP[e.code]; if (!k) return;
  e.preventDefault(); initAudio();
  if (k === "j" && !keys.j) keys.jumpPressed = true;
  keys[k] = true;
});
addEventListener("keyup", e => { const k = KMAP[e.code]; if (k) { e.preventDefault(); keys[k] = false; } });
function bindBtn(id, k){
  const el = document.getElementById(id);
  const on = e => { e.preventDefault(); initAudio(); if (k === "j" && !keys.j) keys.jumpPressed = true; keys[k] = true; el.classList.add("on"); };
  const off = e => { e.preventDefault(); keys[k] = false; el.classList.remove("on"); };
  el.addEventListener("pointerdown", on);
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => el.addEventListener(ev, off));
}
bindBtn("bl", "l"); bindBtn("br", "r"); bindBtn("bj", "j");
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("blur", () => { keys.l = keys.r = keys.j = false; });

/* ---------- Boucle ---------- */
let last = 0, accT = 0;
function loop(ts){
  requestAnimationFrame(loop);
  accT += Math.min(100, ts - last); last = ts;
  while (accT >= 1000 / 60) { update(); accT -= 1000 / 60; }
  draw();
}
startLevel(1); showMenu();
requestAnimationFrame(loop);
})();
</script>
